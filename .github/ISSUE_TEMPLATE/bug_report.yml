name: Reproducible bug
description: Report a broken workflow or numerical discrepancy.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the event, station, phase, branch, controls, and source revision. A shared experiment link helps when it contains no private information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      description: For a numerical discrepancy, include the reference implementation, version, depth, distance, and expected arrivals.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
